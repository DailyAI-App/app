name: DailyAI
options:
  bundleIdPrefix: com.wlstmd
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  DailyAI:
    type: application
    platform: iOS
    sources:
      - path: DailyAI
    resources:
      - path: DailyAI/Assets.xcassets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wlstmd.DailyAI
        INFOPLIST_KEY_NSMotionUsageDescription: "DailyAI uses AirPods motion to estimate your posture."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    scheme:
      testTargets: []
  DailyAIMac:
    type: application
    platform: macOS
    sources:
      - path: DailyAI # same SwiftUI source as the iOS/iPadOS target
    resources:
      - path: DailyAI/Assets.xcassets
      - path: DailyAI/AppIcon.icns
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_NAME: DailyAI
        PRODUCT_BUNDLE_IDENTIFIER: com.wlstmd.DailyAI.mac
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_NSMotionUsageDescription: "DailyAI uses AirPods motion to estimate your posture."
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
